name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://trabajo.com.py
          NEXT_PUBLIC_WHATSAPP_LEADS: '595971000000'
          NEXT_PUBLIC_BUSINESS_NAME: trabajo.com.py
          USE_WP_BACKEND: 'false'
          NEXT_PUBLIC_SHOW_PLANS: 'true'
          NEXT_PUBLIC_FEATURED_BADGES: 'on'

      # No database and no bucket required: the disk driver runs against a temp
      # directory and the validation functions are pure. These are the CV
      # storage layer's security properties (PLAN-PHASE2.md §3), so they are
      # asserted on every push rather than the day someone reads the file.
      - name: Verify CV storage layer
        run: npm run storage:verify

      # The same properties for the public image pipeline (PLAN-IMAGES.md §1),
      # where the failure mode is the inverse: not a leaked file but a hosted
      # one. Covers magic-byte detection, the WebP re-encode, decompression and
      # frame-count bombs, and key traversal. No bucket needed either.
      - name: Verify image storage pipeline
        run: npm run image-storage:verify

      # Same reasoning, for the retention sweep's cutoff arithmetic
      # (PLAN-PHASE2.md §4.3): pure functions, no database, and a wrong answer
      # here deletes data earlier than the privacy policy allows without looking
      # any different in the output.
      - name: Verify retention cutoffs
        run: npm run retention:verify

      # PLAN-PHASE2.md §2.4's promise — no code path returns candidate data
      # without writing data_access_logs — is a property of one file, so it is
      # checked on every push rather than at review time. Also fails on a LIKE
      # search or a bulk export appearing in that module (§5.2).
      - name: Verify candidate access construction
        run: npm run access:verify

      # The no-FK convention's other half: a module that hard-deletes a parent
      # must delete its dependents first. Written in PR 15b, but never wired
      # into CI, so it only ran when someone remembered to run it.
      - name: Verify cascade cleanups
        run: npm run cascade:verify

      # PLAN-PHASE3-DRAFT.md §4 points 6 and 7 (batch K review): article bodies
      # reach dangerouslySetInnerHTML, and `marked` passes raw HTML through by
      # default — so "is it still escaped?" is a question about a dependency's
      # default that a version bump can change. Also asserts a blog slug cannot
      # escape content/blog/.
      - name: Verify blog rendering and slugs
        run: npm run blog:verify
