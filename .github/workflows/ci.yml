name: CI

# Budgeted-runner policy: this repo is private, so every Actions minute is
# billed against a fixed monthly allowance. Four rules keep this workflow cheap,
# and all four are load-bearing — see AGENTS.md:
#
#   1. `pull_request` ONLY. A `push` trigger on the same branches double-bills
#      every commit that is part of a PR: one run for the push, one for the PR.
#   2. `paths-ignore` so the documentation-only PRs (PLAN*.md, ARCHITECTURE.md,
#      the audit write-ups) cost nothing — they cannot break a build.
#   3. `concurrency` + `cancel-in-progress`, because an agent session pushes
#      fix-ups in quick succession and only the last commit's result matters.
#      Superseded runs die instead of each running to completion.
#   4. `timeout-minutes`, because the GitHub default is 360 and one hung job
#      would eat a fifth of the month.
#
# `workflow_dispatch` is free until someone clicks it, and is the escape hatch
# for verifying main by hand after a merge.

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.vscode/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ONE job, deliberately. Actions rounds every job up to a whole minute, so
  # splitting these steps across jobs would cost more than it saves in wall
  # clock. No matrix, and ubuntu-latest only (Windows bills 2x, macOS 10x).
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Before the build, deliberately. Both are seconds, the build is the
      # expensive step, and a PR that fails either would have failed anyway —
      # so failing here costs a fraction of a minute instead of a whole one.
      # (Budget rule, AGENTS.md: these are STEPS in the one job. Splitting them
      # into parallel jobs would bill three rounded-up minutes instead of one.)
      - name: Lint
        run: npm run lint

      # `next build` typechecks the app, but only what it builds. Everything
      # under scripts/ — the purge, the migrations, the nine verify scripts —
      # is compiled by tsx at run time and was never typechecked by CI at all,
      # so a type error there surfaced when an operator ran it against
      # production rather than on the PR that introduced it.
      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://trabajo.com.py
          NEXT_PUBLIC_WHATSAPP_LEADS: '595971000000'
          NEXT_PUBLIC_BUSINESS_NAME: trabajo.com.py
          NEXT_PUBLIC_SHOW_PLANS: 'true'
          NEXT_PUBLIC_FEATURED_BADGES: 'on'

      # No database and no bucket required: the disk driver runs against a temp
      # directory and the validation functions are pure. These are the CV
      # storage layer's security properties (PLAN-PHASE2.md §3), so they are
      # asserted on every push rather than the day someone reads the file.
      - name: Verify CV storage layer
        run: npm run storage:verify

      # The same properties for the public image pipeline (PLAN-IMAGES.md §1),
      # where the failure mode is the inverse: not a leaked file but a hosted
      # one. Covers magic-byte detection, the WebP re-encode, decompression and
      # frame-count bombs, and key traversal. No bucket needed either.
      - name: Verify image storage pipeline
        run: npm run image-storage:verify

      # Same reasoning, for the retention sweep's cutoff arithmetic
      # (PLAN-PHASE2.md §4.3): pure functions, no database, and a wrong answer
      # here deletes data earlier than the privacy policy allows without looking
      # any different in the output.
      - name: Verify retention cutoffs
        run: npm run retention:verify

      # PLAN-PHASE2.md §2.4's promise — no code path returns candidate data
      # without writing data_access_logs — is a property of one file, so it is
      # checked on every push rather than at review time. Also fails on a LIKE
      # search or a bulk export appearing in that module (§5.2).
      - name: Verify candidate access construction
        run: npm run access:verify

      # B1's properties, and the reason they are asserted rather than reviewed:
      # a rate limiter keyed on a spoofable header still returns 429s, an
      # evidence column still holds something that looks like an address, and
      # two paths sharing one limiter instance still limit. None of it is
      # visible in a browser. Pure functions and an in-memory map — no database.
      - name: Verify trusted client IP and limiters
        run: npm run clientip:verify

      # Which public job queries may be cached at all. Too permissive and a
      # crawler's random `?q=` fills the disk; too clever (truncating a value to
      # bound the key) and two searches collide, serving one visitor's results
      # for another's query. Pure function of a filter object — no database.
      - name: Verify job cache key bounds
        run: npm run cachekey:verify

      # The no-FK convention's other half: a module that hard-deletes a parent
      # must delete its dependents first. Written in PR 15b, but never wired
      # into CI, so it only ran when someone remembered to run it.
      - name: Verify cascade cleanups
        run: npm run cascade:verify

      # PLAN-PHASE3-DRAFT.md §4 points 6 and 7 (batch K review): article bodies
      # reach dangerouslySetInnerHTML, and `marked` passes raw HTML through by
      # default — so "is it still escaped?" is a question about a dependency's
      # default that a version bump can change. Also asserts a blog slug cannot
      # escape content/blog/.
      - name: Verify blog rendering and slugs
        run: npm run blog:verify

      # The same question for the other half of the site that reaches
      # dangerouslySetInnerHTML, where the author is untrusted rather than a
      # committer: a job description is employer-submitted text once
      # PLAN-PHASE2.md's employer dashboard ships, and components/
      # MarkdownContent.tsx renders it with hand-rolled regexes. Asserts the
      # escape survives, that it still runs BEFORE the markdown transforms, and
      # that escaped text stays visible instead of being dropped.
      - name: Verify job description rendering
        run: npm run jobs:verify

      # The half of seed↔DB parity that does not need a database. `db:parity`
      # compares the two read paths' output, but only against a populated DB and
      # only for the tie cases lib/seed/jobs.json happens to contain — so a
      # dropped sort key can produce identical output and pass. This pins the DB
      # path's ORDER BY as the source of truth and evaluates the seed path's
      # output against those keys directly.
      - name: Verify seed and DB sort keys
        run: npm run sort:verify

      # O1's promise is that no event leaving this app carries a credential or
      # a data subject, and a scrubber that misses a field looks exactly like
      # one that doesn't: errors still arrive, the issues still read correctly,
      # and the only place the miss is visible is inside a vendor's event
      # store. Asserted here because a browser cannot show it. Pure function of
      # an event object — no DSN and no network.
      - name: Verify Sentry event scrubbing
        run: npm run sentry:verify
